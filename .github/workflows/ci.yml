name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Test and build plugin
        shell: bash
        run: ./gradlew test buildPlugin verifyPluginStructure verifyPlugin --stacktrace

      - name: Check generated command documentation
        shell: bash
        run: |
          python3 scripts/generate_command_docs.py
          git diff --exit-code -- docs/CODEX_COMMANDS.md

      - name: Test native JCEF on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a ./gradlew test -PjcefSmoke=true --stacktrace

      - name: Upload plugin and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}
          path: |
            build/distributions/*.zip
            build/reports/
            build/test-results/
          retention-days: 14
